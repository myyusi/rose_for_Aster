
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>From M. to A. 🌹</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="gate" class="screen">
    <div class="card">
      <div class="small-rose">🌹</div>
      <p class="eyebrow">A LITTLE ROSE JUST FOR YOU 🤪✨</p>
      <h1>For Aster</h1>
      <p class="subtitle">Is a small surprise for you 🥹(。>︿<)_</p>

      <form id="password-form">
        <input
          id="password"
          type="password"
          placeholder="Your secret password"
          autocomplete="off"
          required
        >
        <button type="submit">Unlock my surprise ♡</button>
        <p id="error" role="status"></p>
      </form>
    </div>
  </main>

  <main id="garden" class="screen" hidden>
    <p class="eyebrow">FROM M. TO A.</p>
    <h1 class="garden-title">A rose made of you.</h1>
    <p class="subtitle">Every little word, a little piece of us.</p>

    <div class="canvas-wrap">
      <canvas id="rose" width="700" height="700"></canvas>
    </div>

    <p class="dedication">For my favorite person. Always. ♡</p>
    <button id="replay" class="replay">Watch it bloom again ↻</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
